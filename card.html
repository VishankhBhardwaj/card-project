<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <div class="container">
        <div class="main">
            <img src="59ea56ed-471d-4600-8534-84daa557b2b4.webp" alt="">

                <h2>Order Summary</h2>

            </div>
            <div class="price">
                <div class="leftbox">
                    <div class="leftdiv">
                        <img src="images.jpeg" alt="">
                        <p>AnnualPlan <br>$99.9/year
                        </p>
                    </div>
                    
                </div>
                <div class="rightbox">
                        <a href="">Change</a>

            <div class="lastheading">
                <h3>
                    Cancel Order
                </h3>
            </div>
        </div>
    </div>

</html>
